name: Fetch Steam Reviews Daily

on:
  schedule:
    - cron: "0 6 * * *"  # Runs every day at 6:00 AM UTC (adjust if needed)
  workflow_dispatch:       # Allows you to run it manually from GitHub too

jobs:
  fetch:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Needed to commit the updated CSV back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run review fetcher
        run: python fetch_reviews.py

      - name: Commit and push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.csv
          git diff --staged --quiet || git commit -m "Add reviews for $(date -u '+%Y-%m-%d')"
          git push
